# =============================================================================
#  Extended ceiling presence + air sensor - v2 (carrier PCB)
#  Waveshare ESP32-S3-Zero / HLK-LD2412 / HC-SR602 / BH1750 / ENS160+AHT21
#  optional SCD40/SCD41 (real CO2): uncomment the packages block below
#  https://github.com/PiotrRaszkowski/extended-ceiling-presence-air-sensor
#
#  One device per room. For another room, copy this file and change only the
#  substitutions block.
# =============================================================================

substitutions:
  name: ceiling-sensor-living-room
  friendly_name: Living room sensor

# Fitted the optional SCD40/SCD41? Uncomment these two lines (scd4x.yaml lives next to this file).
# packages:
#   scd4x: !include scd4x.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0         # encrypted OTA that inherits the API key
  project:
    name: piotrraszkowski.ceiling-presence-air-sensor
    version: "2.0.0"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB                # ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM
  framework:
    type: esp-idf

# Logs go over the native USB port, so no hardware UART is used for logging
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:                  # inherits the API encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the PIR fires on its own because of 2.4 GHz noise:
  # output_power: 8.5dB
  ap:
    ssid: ${name}            # fallback hotspot if Wi-Fi is unreachable (max 32 chars)
    password: !secret ap_password

captive_portal:

# -----------------------------------------------------------------------------
#  Buses (the ESP32-S3 GPIO matrix lets UART/I2C use any pins)
# -----------------------------------------------------------------------------
uart:
  - id: uart_radar
    tx_pin: GPIO4                # -> radar RX
    rx_pin: GPIO5                # <- radar TX
    baud_rate: 115200            # LD2412 factory default
    parity: NONE
    stop_bits: 1

i2c:
  id: i2c_bus
  sda: GPIO1
  scl: GPIO2
  frequency: 100kHz
  scan: true

ld2412:
  id: radar
  uart_id: uart_radar

globals:
  - id: occ_latched
    type: bool
    restore_value: false
    initial_value: "false"

# -----------------------------------------------------------------------------
#  Presence
# -----------------------------------------------------------------------------
binary_sensor:
  # The one to use in automations:
  #   - turns ON on motion (PIR or a moving radar target)
  #   - is HELD by any radar target, including a still one
  #   - turns OFF when nothing is detected for "Presence hold time"
  - platform: template
    id: occupancy
    name: Occupancy
    device_class: occupancy
    lambda: |-
      const bool motion = id(pir).state || id(radar_moving).state;
      const bool anything = motion || id(radar_target).state;
      if (motion) id(occ_latched) = true;
      else if (!anything) id(occ_latched) = false;
      return id(occ_latched);
    filters:
      - delayed_off: !lambda "return (uint32_t) (id(hold_time).state * 1000);"

  - platform: gpio
    id: pir
    name: PIR motion
    device_class: motion
    pin:
      number: GPIO6
      mode: INPUT_PULLDOWN
    filters:
      - delayed_off: 2s

  - platform: ld2412
    ld2412_id: radar
    has_target:
      id: radar_target
      name: Radar presence
      device_class: occupancy
    has_moving_target:
      id: radar_moving
      name: Radar moving target
    has_still_target:
      id: radar_still
      name: Radar still target
    dynamic_background_correction_status:
      name: Radar background correction running
      entity_category: diagnostic

# -----------------------------------------------------------------------------
#  Measurements
# -----------------------------------------------------------------------------
sensor:
  # --- SHT40 in its own pocket: the room temperature and humidity -------------------
  # (v1 used the AHT21 on the ENS160 board, which reads ~10 degC high: the ENS160 heater sits next to it)
  - platform: sht4x
    address: 0x44
    update_interval: 15s
    temperature:
      id: temp_sht
      name: Temperature raw
      internal: true
    humidity:
      id: rh_sht
      name: Humidity raw
      internal: true

  - platform: template
    id: temperature
    name: Temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      if (isnan(id(temp_sht).state)) return {};
      return id(temp_sht).state + id(temp_offset).state;

  # Relative humidity recalculated for the offset temperature (Magnus formula); with offset 0 it is the SHT40 value
  - platform: template
    id: humidity
    name: Humidity
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      const float t0 = id(temp_sht).state;
      const float rh0 = id(rh_sht).state;
      if (isnan(t0) || isnan(rh0)) return {};
      const float t = t0 + id(temp_offset).state;
      auto es = [](float tc) { return expf(17.62f * tc / (243.12f + tc)); };
      const float rh = rh0 * es(t0) / es(t);
      return std::max(0.0f, std::min(100.0f, rh));

  # --- AHT21 (on the ENS160 board): only for the ENS160's own compensation ------------
  # It measures the air in the closed chamber, warmed by the ENS160 heater, which is what the
  # ENS160 needs; it is not the room temperature.
  - platform: aht10
    variant: AHT20               # AHT21 is compatible
    address: 0x38
    update_interval: 15s
    temperature:
      id: temp_raw
      name: Chamber temperature
      entity_category: diagnostic
    humidity:
      id: rh_raw
      name: Chamber humidity
      entity_category: diagnostic

  # --- ENS160: estimated CO2 (derived from VOCs!), TVOC, AQI 1-5 ---------------
  - platform: ens160_i2c
    address: 0x53                # combo boards pull ADD up; no answer at 0x53 -> bridge JP1 (and JP2 for CS)
    update_interval: 30s
    eco2:
      id: eco2
      name: eCO2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 1
    tvoc:
      id: tvoc
      name: TVOC
    aqi:
      id: aqi
      name: AQI
    compensation:
      temperature: temp_raw
      humidity: rh_raw

  # --- Light -------------------------------------------------------------------
  - platform: bh1750
    name: Illuminance
    address: 0x23
    update_interval: 10s

  # --- Radar distances -----------------------------------------------------------
  - platform: ld2412
    ld2412_id: radar
    moving_distance:
      name: Radar moving distance
    still_distance:
      name: Radar still distance
    detection_distance:
      name: Radar detection distance
    moving_energy:
      name: Radar moving energy
      entity_category: diagnostic
    still_energy:
      name: Radar still energy
      entity_category: diagnostic
    # Per-gate energies (14 gates of 0.75 m). They only update with "Radar engineering mode" on
    # and are disabled by default in Home Assistant; enable them while tuning.
    gate_0:
      move_energy:
        name: Radar g0 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g0 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_1:
      move_energy:
        name: Radar g1 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g1 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_2:
      move_energy:
        name: Radar g2 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g2 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_3:
      move_energy:
        name: Radar g3 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g3 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_4:
      move_energy:
        name: Radar g4 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g4 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_5:
      move_energy:
        name: Radar g5 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g5 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_6:
      move_energy:
        name: Radar g6 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g6 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_7:
      move_energy:
        name: Radar g7 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g7 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_8:
      move_energy:
        name: Radar g8 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g8 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_9:
      move_energy:
        name: Radar g9 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g9 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_10:
      move_energy:
        name: Radar g10 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g10 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_11:
      move_energy:
        name: Radar g11 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g11 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_12:
      move_energy:
        name: Radar g12 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g12 still energy
        entity_category: diagnostic
        disabled_by_default: true
    gate_13:
      move_energy:
        name: Radar g13 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g13 still energy
        entity_category: diagnostic
        disabled_by_default: true

  # --- Diagnostics ---------------------------------------------------------------
  - platform: internal_temperature
    name: ESP32 temperature
    entity_category: diagnostic

  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: Uptime
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: aq_level
    name: Air quality
    icon: mdi:air-filter
    update_interval: 30s
    # ENS160 AQI-UBA: 1 excellent ... 5 unhealthy
    lambda: |-
      const float a = id(aqi).state;
      if (isnan(a) || a < 1) return {};
      static const char *const LEVELS[] = {"Excellent", "Good", "Moderate", "Poor", "Unhealthy"};
      const int i = std::min(5, (int) a) - 1;
      return std::string(LEVELS[i]);

  - platform: ld2412
    ld2412_id: radar
    version:
      name: Radar firmware
    mac_address:
      name: Radar MAC

# -----------------------------------------------------------------------------
#  Settings exposed to Home Assistant
# -----------------------------------------------------------------------------
number:
  - platform: template
    id: hold_time
    name: Presence hold time
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 600
    step: 5
    initial_value: 15
    optimistic: true
    restore_value: true

  - platform: template
    id: temp_offset
    name: Temperature offset
    icon: mdi:thermometer-minus
    entity_category: config
    unit_of_measurement: "°C"
    min_value: -5
    max_value: 5
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true

  # Radar tuning: one gate = 0.75 m (g0 = 0-0.75 m, g1 = 0.75-1.5 m, ...). From a 2.6 m ceiling
  # the floor is in gate 3; max_distance_gate limits how far the radar looks.
  - platform: ld2412
    ld2412_id: radar
    timeout:
      name: Radar timeout
    min_distance_gate:
      name: Radar min gate
    max_distance_gate:
      name: Radar max gate
    gate_0:
      move_threshold: {name: Radar g0 move threshold}
      still_threshold: {name: Radar g0 still threshold}
    gate_1:
      move_threshold: {name: Radar g1 move threshold}
      still_threshold: {name: Radar g1 still threshold}
    gate_2:
      move_threshold: {name: Radar g2 move threshold}
      still_threshold: {name: Radar g2 still threshold}
    gate_3:
      move_threshold: {name: Radar g3 move threshold}
      still_threshold: {name: Radar g3 still threshold}
    gate_4:
      move_threshold: {name: Radar g4 move threshold}
      still_threshold: {name: Radar g4 still threshold}
    gate_5:
      move_threshold: {name: Radar g5 move threshold}
      still_threshold: {name: Radar g5 still threshold}
    gate_6:
      move_threshold: {name: Radar g6 move threshold}
      still_threshold: {name: Radar g6 still threshold}
    gate_7:
      move_threshold: {name: Radar g7 move threshold}
      still_threshold: {name: Radar g7 still threshold}
    gate_8:
      move_threshold: {name: Radar g8 move threshold}
      still_threshold: {name: Radar g8 still threshold}
    gate_9:
      move_threshold: {name: Radar g9 move threshold}
      still_threshold: {name: Radar g9 still threshold}
    gate_10:
      move_threshold: {name: Radar g10 move threshold}
      still_threshold: {name: Radar g10 still threshold}
    gate_11:
      move_threshold: {name: Radar g11 move threshold}
      still_threshold: {name: Radar g11 still threshold}
    gate_12:
      move_threshold: {name: Radar g12 move threshold}
      still_threshold: {name: Radar g12 still threshold}
    gate_13:
      move_threshold: {name: Radar g13 move threshold}
      still_threshold: {name: Radar g13 still threshold}

select:
  - platform: ld2412
    ld2412_id: radar
    distance_resolution:
      name: Radar gate resolution

switch:
  - platform: ld2412
    ld2412_id: radar
    engineering_mode:
      name: Radar engineering mode
    bluetooth:
      name: Radar Bluetooth          # on from the factory; turn off after setup

  - platform: template
    id: led_aq_enabled
    name: Air quality LED
    icon: mdi:led-on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - light.turn_off: status_led

button:
  - platform: ld2412
    ld2412_id: radar
    restart:
      name: Radar restart
    query_params:
      name: Radar read parameters
    start_dynamic_background_correction:
      name: Radar learn empty room       # run it with nobody in the room

  - platform: restart
    name: Restart

# -----------------------------------------------------------------------------
#  On-board RGB LED (WS2812 on GPIO21) shows the air quality colour.
#  If red and green are swapped, change channel_colors to GRB.
# -----------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO21
    num_leds: 1
    chipset: WS2812
    channel_colors: RGB

interval:
  - interval: 30s
    then:
      - if:
          condition:
            switch.is_on: led_aq_enabled
          then:
            - lambda: |-
                const float a = id(aqi).state;
                if (isnan(a) || a < 1) return;
                float r, g, b;
                if (a < 3)       { r = 0.0f; g = 1.0f; b = 0.1f; }   // fine
                else if (a < 4)  { r = 1.0f; g = 0.6f; b = 0.0f; }   // open a window
                else             { r = 1.0f; g = 0.0f; b = 0.0f; }   // bad
                auto call = id(status_led).turn_on();
                call.set_rgb(r, g, b);
                call.set_brightness(0.2f);
                call.set_transition_length(1000);
                call.perform();
