# =============================================================================
#  Extended ceiling presence + air sensor
#  Waveshare ESP32-S3-Zero / HLK-LD2410B / HC-SR602 / BH1750 / ENS160+AHT21
#  https://github.com/PiotrRaszkowski/extended-ceiling-presence-air-sensor
#
#  One device per room. For another room, copy this file and change only the
#  substitutions block.
# =============================================================================

substitutions:
  name: ceiling-sensor-living-room
  friendly_name: Living room sensor

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0         # encrypted OTA that inherits the API key
  project:
    name: piotrraszkowski.ceiling-presence-air-sensor
    version: "1.0.0"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB                # ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM
  framework:
    type: esp-idf

# Logs go over the native USB port, so no hardware UART is used for logging
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:                  # inherits the API encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the PIR fires on its own because of 2.4 GHz noise (even with the RC filter):
  # output_power: 8.5dB
  ap:
    ssid: ${name}            # fallback hotspot if Wi-Fi is unreachable (max 32 chars)
    password: !secret ap_password

captive_portal:

# -----------------------------------------------------------------------------
#  Buses (the ESP32-S3 GPIO matrix lets UART/I2C use any pins)
# -----------------------------------------------------------------------------
uart:
  - id: uart_radar
    tx_pin: GPIO4                # -> radar RX
    rx_pin: GPIO5                # <- radar TX
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

i2c:
  id: i2c_bus
  sda: GPIO1
  scl: GPIO2
  frequency: 100kHz
  scan: true

ld2410:
  id: radar
  uart_id: uart_radar

globals:
  - id: occ_latched
    type: bool
    restore_value: false
    initial_value: "false"

# -----------------------------------------------------------------------------
#  Presence
# -----------------------------------------------------------------------------
binary_sensor:
  # The one to use in automations:
  #   - turns ON on motion (PIR or a moving radar target)
  #   - is HELD by any radar target, including a still one
  #   - turns OFF when nothing is detected for "Presence hold time"
  - platform: template
    id: occupancy
    name: Occupancy
    device_class: occupancy
    lambda: |-
      const bool motion = id(pir).state || id(radar_moving).state;
      const bool anything = motion || id(radar_target).state;
      if (motion) id(occ_latched) = true;
      else if (!anything) id(occ_latched) = false;
      return id(occ_latched);
    filters:
      - delayed_off: !lambda "return (uint32_t) (id(hold_time).state * 1000);"

  - platform: gpio
    id: pir
    name: PIR motion
    device_class: motion
    pin:
      number: GPIO6
      mode: INPUT_PULLDOWN
    filters:
      - delayed_off: 2s

  - platform: ld2410
    ld2410_id: radar
    has_target:
      id: radar_target
      name: Radar presence
      device_class: occupancy
    has_moving_target:
      id: radar_moving
      name: Radar moving target
    has_still_target:
      id: radar_still
      name: Radar still target

# -----------------------------------------------------------------------------
#  Measurements
# -----------------------------------------------------------------------------
sensor:
  # --- AHT21 (on the same board as the ENS160) --------------------------------
  - platform: aht10
    variant: AHT20               # AHT21 is compatible
    address: 0x38
    update_interval: 15s
    temperature:
      id: temp_raw
      name: Temperature raw
      internal: true
    humidity:
      id: rh_raw
      name: Humidity raw
      internal: true

  # Temperature corrected for self-heating (the ENS160 heater sits next to the AHT21)
  - platform: template
    id: temperature
    name: Temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      if (isnan(id(temp_raw).state)) return {};
      return id(temp_raw).state + id(temp_offset).state;

  # Relative humidity recalculated for the corrected temperature (Magnus formula)
  - platform: template
    id: humidity
    name: Humidity
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      const float t0 = id(temp_raw).state;
      const float rh0 = id(rh_raw).state;
      if (isnan(t0) || isnan(rh0)) return {};
      const float t = t0 + id(temp_offset).state;
      auto es = [](float tc) { return expf(17.62f * tc / (243.12f + tc)); };
      const float rh = rh0 * es(t0) / es(t);
      return std::max(0.0f, std::min(100.0f, rh));

  # --- ENS160: estimated CO2 (derived from VOCs!), TVOC, AQI 1-5 ---------------
  - platform: ens160_i2c
    address: 0x53                # ENS160+AHT21 combo boards tie ADD to 3V3
    update_interval: 30s
    eco2:
      id: eco2
      name: eCO2
      filters:
        - sliding_window_moving_average:
            window_size: 4
            send_every: 1
    tvoc:
      id: tvoc
      name: TVOC
    aqi:
      id: aqi
      name: AQI
    compensation:
      temperature: temperature
      humidity: humidity

  # --- Light -------------------------------------------------------------------
  - platform: bh1750
    name: Illuminance
    address: 0x23
    update_interval: 10s

  # --- Radar distances -----------------------------------------------------------
  - platform: ld2410
    ld2410_id: radar
    moving_distance:
      name: Radar moving distance
    still_distance:
      name: Radar still distance
    detection_distance:
      name: Radar detection distance
    moving_energy:
      name: Radar moving energy
      entity_category: diagnostic
    still_energy:
      name: Radar still energy
      entity_category: diagnostic
    # Per-gate energies. They only update with "Radar engineering mode" on and
    # are disabled by default in Home Assistant; enable them while tuning.
    g0:
      move_energy:
        name: Radar g0 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g0 still energy
        entity_category: diagnostic
        disabled_by_default: true
    g1:
      move_energy:
        name: Radar g1 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g1 still energy
        entity_category: diagnostic
        disabled_by_default: true
    g2:
      move_energy:
        name: Radar g2 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g2 still energy
        entity_category: diagnostic
        disabled_by_default: true
    g3:
      move_energy:
        name: Radar g3 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g3 still energy
        entity_category: diagnostic
        disabled_by_default: true
    g4:
      move_energy:
        name: Radar g4 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g4 still energy
        entity_category: diagnostic
        disabled_by_default: true
    g5:
      move_energy:
        name: Radar g5 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g5 still energy
        entity_category: diagnostic
        disabled_by_default: true
    g6:
      move_energy:
        name: Radar g6 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g6 still energy
        entity_category: diagnostic
        disabled_by_default: true
    g7:
      move_energy:
        name: Radar g7 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g7 still energy
        entity_category: diagnostic
        disabled_by_default: true
    g8:
      move_energy:
        name: Radar g8 move energy
        entity_category: diagnostic
        disabled_by_default: true
      still_energy:
        name: Radar g8 still energy
        entity_category: diagnostic
        disabled_by_default: true

  # --- Diagnostics ---------------------------------------------------------------
  - platform: internal_temperature
    name: ESP32 temperature
    entity_category: diagnostic

  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: Uptime
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: aq_level
    name: Air quality
    icon: mdi:air-filter
    update_interval: 30s
    # ENS160 AQI-UBA: 1 excellent ... 5 unhealthy
    lambda: |-
      const float a = id(aqi).state;
      if (isnan(a) || a < 1) return {};
      static const char *const LEVELS[] = {"Excellent", "Good", "Moderate", "Poor", "Unhealthy"};
      const int i = std::min(5, (int) a) - 1;
      return std::string(LEVELS[i]);

  - platform: ld2410
    ld2410_id: radar
    version:
      name: Radar firmware
    mac_address:
      name: Radar MAC

# -----------------------------------------------------------------------------
#  Settings exposed to Home Assistant
# -----------------------------------------------------------------------------
number:
  - platform: template
    id: hold_time
    name: Presence hold time
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 600
    step: 5
    initial_value: 15
    optimistic: true
    restore_value: true

  - platform: template
    id: temp_offset
    name: Temperature offset
    icon: mdi:thermometer-minus
    entity_category: config
    unit_of_measurement: "°C"
    min_value: -8
    max_value: 2
    step: 0.1
    initial_value: -2.5
    optimistic: true
    restore_value: true

  # Radar tuning: one gate = 0.75 m (g0 = 0-0.75 m, g1 = 0.75-1.5 m, ...)
  - platform: ld2410
    ld2410_id: radar
    timeout:
      name: Radar timeout
    max_move_distance_gate:
      name: Radar max moving gate
    max_still_distance_gate:
      name: Radar max still gate
    g0:
      move_threshold: {name: Radar g0 move threshold}
      still_threshold: {name: Radar g0 still threshold}
    g1:
      move_threshold: {name: Radar g1 move threshold}
      still_threshold: {name: Radar g1 still threshold}
    g2:
      move_threshold: {name: Radar g2 move threshold}
      still_threshold: {name: Radar g2 still threshold}
    g3:
      move_threshold: {name: Radar g3 move threshold}
      still_threshold: {name: Radar g3 still threshold}
    g4:
      move_threshold: {name: Radar g4 move threshold}
      still_threshold: {name: Radar g4 still threshold}
    g5:
      move_threshold: {name: Radar g5 move threshold}
      still_threshold: {name: Radar g5 still threshold}
    g6:
      move_threshold: {name: Radar g6 move threshold}
      still_threshold: {name: Radar g6 still threshold}
    g7:
      move_threshold: {name: Radar g7 move threshold}
      still_threshold: {name: Radar g7 still threshold}
    g8:
      move_threshold: {name: Radar g8 move threshold}
      still_threshold: {name: Radar g8 still threshold}

select:
  - platform: ld2410
    ld2410_id: radar
    distance_resolution:
      name: Radar gate resolution

switch:
  - platform: ld2410
    ld2410_id: radar
    engineering_mode:
      name: Radar engineering mode
    bluetooth:
      name: Radar Bluetooth          # on from the factory; turn off after setup

  - platform: template
    id: led_aq_enabled
    name: Air quality LED
    icon: mdi:led-on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - light.turn_off: status_led

button:
  - platform: ld2410
    ld2410_id: radar
    restart:
      name: Radar restart
    query_params:
      name: Radar read parameters

  - platform: restart
    name: Restart

# -----------------------------------------------------------------------------
#  On-board RGB LED (WS2812 on GPIO21) shows the air quality colour.
#  If red and green are swapped, change channel_colors to GRB.
# -----------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO21
    num_leds: 1
    chipset: WS2812
    channel_colors: RGB

interval:
  - interval: 30s
    then:
      - if:
          condition:
            switch.is_on: led_aq_enabled
          then:
            - lambda: |-
                const float a = id(aqi).state;
                if (isnan(a) || a < 1) return;
                float r, g, b;
                if (a < 3)       { r = 0.0f; g = 1.0f; b = 0.1f; }   // fine
                else if (a < 4)  { r = 1.0f; g = 0.6f; b = 0.0f; }   // open a window
                else             { r = 1.0f; g = 0.0f; b = 0.0f; }   // bad
                auto call = id(status_led).turn_on();
                call.set_rgb(r, g, b);
                call.set_brightness(0.2f);
                call.set_transition_length(1000);
                call.perform();
