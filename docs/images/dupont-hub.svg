<text x="1128.0" y="380.0" font-size="13" text-anchor="start" font-weight="400" fill="#263238">ESP GP2, BH1750 SCL, ENS160 SCL (3)</text>
<text x="750.0" y="490.0" font-size="14" text-anchor="middle" font-weight="400" fill="#455a64">3V3 does not go through the hub: one jumper straight from the ESP 3V3 pin to BH1750 VCC.</text>
<text x="750.0" y="516.0" font-size="14" text-anchor="middle" font-weight="400" fill="#455a64">The top row points up when the board sits in the housing. Test every net for shorts to its neighbours with a meter before plugging in.</text>
<text x="750.0" y="542.0" font-size="14" text-anchor="middle" font-weight="400" fill="#455a64">One female-female Dupont jumper per module and net: GND 6, 5V 5, SDA 3, SCL 3 pins. The 3 empty holes are spare.</text>
